<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 10px;
  }
</style>

<div class="row"
     style="padding-top: 10%; padding-bottom: 5%;
            background: url(assets/files/wall.jpg);
            background-attachment: fixed;
            background-size: cover;
            width: auto;
            height: 119vh;">

  <div class="col-sm-4"></div>

  <div class="col-sm-4">
    <div class="card">
      <div class="card-body shadow-lg grad">

        <form>

          <h2 class="text-primary font-weight-bold">{{ 'Change Password' | translate }}</h2>

          <!-- ERROR -->
          <div *ngIf="form.error" class="alert alert-danger alert-dismissible">
            <button type="button" class="close" data-dismiss="alert">&times;</button>
            {{ form.message }}
          </div>

          <!-- SUCCESS -->
          <div *ngIf="!form.error && form.message"
               class="alert alert-success alert-dismissible">
            <button type="button" class="close" data-dismiss="alert">&times;</button>
            {{ form.message }}
          </div>

          <!-- OLD PASSWORD -->
          <div style="padding-top:3%">
            <span><b>{{ 'Old Password' | translate }}</b><span class="required-field"></span></span>

            <div class="col-sm-12">
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-key grey-text"></i>
                  </div>
                </div>
                <input type="password"
                       name="oldPassword"
                       [(ngModel)]="form.data.oldPassword"
                       class="form-control"
                       placeholder="{{ 'Enter Old Password' | translate }}">
              </div>
            </div>

            <span *ngIf="form.inputerror?.oldPassword"
                  class="alertRedColor" style="color:red;">
              {{ form.inputerror.oldPassword }}
            </span>
          </div>

          <!-- NEW PASSWORD -->
          <div style="padding-top:3%">
            <span><b>{{ 'New Password' | translate }}</b><span class="required-field"></span></span>

            <div class="col-sm-12">
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-unlock-alt grey-text"></i>
                  </div>
                </div>
                <input type="password"
                       name="newPassword"
                       [(ngModel)]="form.data.newPassword"
                       class="form-control"
                       placeholder="{{ 'Enter New Password' | translate }}">
              </div>
            </div>

            <span *ngIf="form.inputerror?.newPassword"
                  class="alertRedColor" style="color:red;">
              {{ form.inputerror.newPassword }}
            </span>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div style="padding-top:3%">
            <span><b>{{ 'Confirm Password' | translate }}</b><span class="required-field"></span></span>

            <div class="col-sm-12">
              <div class="input-group">
                <div class="input-group-prepend">
                  <div class="input-group-text">
                    <i class="fa fa-unlock grey-text"></i>
                  </div>
                </div>
                <input type="password"
                       name="confirmPassword"
                       [(ngModel)]="form.data.confirmPassword"
                       class="form-control"
                       placeholder="{{ 'Confirm Password' | translate }}">
              </div>
            </div>

            <span *ngIf="form.inputerror?.confirmPassword"
                  class="alertRedColor" style="color:red;">
              {{ form.inputerror.confirmPassword }}
            </span>
          </div>

          <!-- SUBMIT BUTTON -->
          <div class="row pt-3 pl-3 pb-3">

            <div class="pt-2">
              <button (click)="changePassword()" class="btn btn-success mr-2">
                {{ 'Update' | translate }}
              </button>
            </div>

            <!-- ✅ Hidden Field -->
            <input type="hidden"
                   name="loginId"
                   [(ngModel)]="form.data.loginId" />

          </div>

        </form>

      </div>
    </div>
  </div>

</div>

<app-footer></app-footer>
